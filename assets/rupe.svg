<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definição da máscara de recorte baseada no hexágono interno -->
  <defs>
    <clipPath id="inner-hexagon-clip">
      <polygon points="100,58 123,76 123,124 100,142 77,124 77,76" />
    </clipPath>
  </defs>

  <!-- Contorno externo da gema -->
  <path
    d="M 100 18
       L 149 57
       L 149 143
       L 100 182
       L 51 143
       L 51 57
       Z"
    fill="none"
    stroke="#DDBE80"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Faceta central (hexágono interior) -->
  <polygon
    id="inner-hexagon"
    points="100,58 123,76 123,124 100,142 77,124 77,76"
    fill="none"
    stroke="#DDBE80"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Linhas conetoras entre o centro e os vértices externos (sempre tocam o exterior do hexágono interno) -->
  <line x1="100" y1="18"  x2="100" y2="58"  stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  <line x1="149" y1="57"  x2="123" y2="76"  stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  <line x1="149" y1="143" x2="123" y2="124" stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  <line x1="100" y1="182" x2="100" y2="142" stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  <line x1="51"  y1="143" x2="77"  y2="124" stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  <line x1="51"  y1="57"  x2="77"  y2="76"  stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />

  <!-- Grupo com as linhas diagonais internas que são cortadas pela máscara do hexágono -->
  <g clip-path="url(#inner-hexagon-clip)">
    <!-- O curso das linhas foi estendido para garantir que encostem nas bordas, e o recorte as apara -->
    <line x1="60" y1="120" x2="140" y2="50" stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
    <line x1="60" y1="150" x2="140" y2="80" stroke="#DDBE80" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
